name: HRM Canonical Redirect Hotfix

on:
  push:
    branches: [main]
    paths:
      - 'website/.htaccess'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Require FTPS secrets
        env:
          LOOPIA_FTPS_USERNAME: ${{ secrets.LOOPIA_FTPS_USERNAME }}
          LOOPIA_FTPS_PASSWORD: ${{ secrets.LOOPIA_FTPS_PASSWORD }}
        shell: bash
        run: |
          test -n "$LOOPIA_FTPS_USERNAME"
          test -n "$LOOPIA_FTPS_PASSWORD"

      - name: Back up current htaccess
        env:
          LOOPIA_FTPS_USERNAME: ${{ secrets.LOOPIA_FTPS_USERNAME }}
          LOOPIA_FTPS_PASSWORD: ${{ secrets.LOOPIA_FTPS_PASSWORD }}
        shell: bash
        run: |
          mkdir -p backup
          curl --fail --silent --show-error --ftp-ssl-reqd \
            --user "$LOOPIA_FTPS_USERNAME:$LOOPIA_FTPS_PASSWORD" \
            ftp://ftpcluster.loopia.se/.htaccess \
            --output backup/.htaccess

      - name: Save rollback copy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hrm-htaccess-before-proxy-fix-${{ github.run_id }}
          path: backup/.htaccess
          include-hidden-files: true
          retention-days: 30

      - name: Deploy corrected htaccess
        env:
          LOOPIA_FTPS_USERNAME: ${{ secrets.LOOPIA_FTPS_USERNAME }}
          LOOPIA_FTPS_PASSWORD: ${{ secrets.LOOPIA_FTPS_PASSWORD }}
        shell: bash
        run: |
          curl --fail --silent --show-error --ftp-ssl-reqd \
            --user "$LOOPIA_FTPS_USERNAME:$LOOPIA_FTPS_PASSWORD" \
            --upload-file website/.htaccess \
            ftp://ftpcluster.loopia.se/.htaccess

      - name: Verify canonical URLs
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://hrm.se/)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://hrm.se/robots.txt)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://hrm.se/sitemap.xml)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://hrm.se/hrm-benchmark.html)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://hrm.se/llms.txt)" = "200"
          final="$(curl -sS -L --max-redirs 5 -o /dev/null -w '%{http_code} %{url_effective}' http://hrm.se/)"
          test "$final" = "200 https://hrm.se/"
          final="$(curl -sS -L --max-redirs 5 -o /dev/null -w '%{http_code} %{url_effective}' https://www.hrm.se/)"
          test "$final" = "200 https://hrm.se/"
          final="$(curl -sS -L --max-redirs 5 -o /dev/null -w '%{http_code} %{url_effective}' https://hrm.se/index.html)"
          test "$final" = "200 https://hrm.se/"