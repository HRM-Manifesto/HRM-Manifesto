name: HRM New Phase Public Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hrm-new-phase-public-deploy-once.yml'

permissions:
  contents: read

env:
  PAYLOAD_LIST: deployment/hrm-new-phase-files.txt

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Verify founder-signed core
        run: python3 tools/verify_hrm_release.py core/1.0.0 --public-key core/1.0.0/signatures/HRM_FOUNDER.pub

      - name: Verify public mirror bytes and canonical transport package
        shell: bash
        run: |
          set -euo pipefail
          cmp core/1.0.0/release.json website/core/1.0.0/release.json
          cmp core/1.0.0/release.json.minisig website/core/1.0.0/release.json.minisig
          cmp core/1.0.0/signatures/HRM_FOUNDER.pub website/core/1.0.0/signatures/HRM_FOUNDER.pub
          (cd website/core/1.0.0 && sha256sum --check package.zip.sha256)
          python3 -m json.tool website/ai/1.0.0/catalog.json >/dev/null
          python3 -m json.tool website/manifest.json >/dev/null

      - name: Build exact new-phase payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deployment/new-phase-dist
          mkdir -p deployment/new-phase-dist
          while IFS= read -r file; do
            test -n "$file"
            test -f "website/$file"
            mkdir -p "deployment/new-phase-dist/$(dirname "$file")"
            cp --preserve=mode,timestamps "website/$file" "deployment/new-phase-dist/$file"
          done < "$PAYLOAD_LIST"

      - name: Upload verified payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hrm-new-phase-payload-${{ github.run_id }}
          path: deployment/new-phase-dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: hrm-production
    steps:
      - name: Check out path list
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download verified payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hrm-new-phase-payload-${{ github.run_id }}
          path: payload

      - name: Require FTPS secrets
        env:
          LOOPIA_FTPS_USERNAME: ${{ secrets.LOOPIA_FTPS_USERNAME }}
          LOOPIA_FTPS_PASSWORD: ${{ secrets.LOOPIA_FTPS_PASSWORD }}
        shell: bash
        run: |
          test -n "$LOOPIA_FTPS_USERNAME"
          test -n "$LOOPIA_FTPS_PASSWORD"

      - name: Back up exact production targets
        env:
          LOOPIA_FTPS_USERNAME: ${{ secrets.LOOPIA_FTPS_USERNAME }}
          LOOPIA_FTPS_PASSWORD: ${{ secrets.LOOPIA_FTPS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup/files
          : > backup/missing.txt
          while IFS= read -r file; do
            mkdir -p "backup/files/$(dirname "$file")"
            set +e
            curl --fail --silent --show-error --ftp-ssl-reqd \
              --user "$LOOPIA_FTPS_USERNAME:$LOOPIA_FTPS_PASSWORD" \
              "ftp://ftpcluster.loopia.se/$file" --output "backup/files/$file"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              rm -f "backup/files/$file"
              printf '%s\n' "$file" >> backup/missing.txt
            fi
          done < "$PAYLOAD_LIST"

      - name: Save rollback artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hrm-new-phase-backup-${{ github.run_id }}
          path: backup/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Deploy verified payload
        env:
          LOOPIA_FTPS_USERNAME: ${{ secrets.LOOPIA_FTPS_USERNAME }}
          LOOPIA_FTPS_PASSWORD: ${{ secrets.LOOPIA_FTPS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            curl --fail --silent --show-error --ftp-ssl-reqd --ftp-create-dirs \
              --user "$LOOPIA_FTPS_USERNAME:$LOOPIA_FTPS_PASSWORD" \
              --upload-file "payload/$file" "ftp://ftpcluster.loopia.se/$file"
          done < "$PAYLOAD_LIST"

      - name: Verify public HTTPS byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-verify
          while IFS= read -r file; do
            mkdir -p "public-verify/$(dirname "$file")"
            curl --location --fail --silent --show-error --proto '=https' --tlsv1.2 \
              "https://hrm.se/$file?deployment=${{ github.run_id }}" \
              --output "public-verify/$file"
            cmp "payload/$file" "public-verify/$file"
          done < "$PAYLOAD_LIST"
          sudo apt-get update >/dev/null
          sudo apt-get install -y minisign >/dev/null
          minisign -Vm public-verify/core/1.0.0/release.json \
            -x public-verify/core/1.0.0/release.json.minisig \
            -p public-verify/core/1.0.0/signatures/HRM_FOUNDER.pub
          (cd public-verify/core/1.0.0 && sha256sum --check package.zip.sha256)